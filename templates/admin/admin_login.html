{% extends 'base.html' %} {% block title %}Admin Login{% endblock %} {% block
content %}

<div class="auth-container">
  <div class="auth-box admin-auth">
    <div class="auth-form active">
      <div class="admin-header">
        <div class="admin-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <h2>Admin Login</h2>
        <p class="auth-subtitle">Access the administration dashboard</p>
      </div>

      {% if error %}
      <div class="auth-alert">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form
        method="POST"
        action="{{ url_for('admin_login') }}"
        class="form-grid"
      >
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Enter admin username"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Enter admin password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('password')"
            >
              <svg
                class="eye-show"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg
                class="eye-hide"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" />
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" class="auth-submit admin-submit">
          <span>Login as Administrator</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>

      <div class="admin-footer">
        <a href="{{ url_for('index') }}" class="back-to-site">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Back to main site
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %} {% block scripts %}
<script>
  function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const parent = input.closest(".input-icon");
    const type = input.type === "password" ? "text" : "password";
    input.type = type;
    parent.classList.toggle("showing-password");
  }

  // Add loading state to form submission
  document.querySelector("form").addEventListener("submit", function (e) {
    const button = this.querySelector('button[type="submit"]');
    button.disabled = true;
    button.innerHTML =
      '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Logging in...';
  });
</script>
{% endblock %}

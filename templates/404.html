{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 80px 20px;">
  <h1 style="font-size: 4rem; margin: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
  <h2 style="margin: 12px 0; color: var(--text);">Page Not Found</h2>
  <p style="color: var(--muted); margin-bottom: 24px;">The page you are looking for does not exist or has been moved.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
